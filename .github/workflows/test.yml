# Test workflow: builds and runs the NUnit and xUnit test projects on
# Linux, macOS, and Windows.
name: test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Build test projects
        shell: bash
        run: |
          dotnet build VDrumExplorer.Model.Test/VDrumExplorer.Model.Test.csproj --configuration Release
          dotnet build VDrumExplorer.ViewModel.Test/VDrumExplorer.ViewModel.Test.csproj --configuration Release

      - name: Run Model tests
        shell: bash
        run: dotnet test VDrumExplorer.Model.Test/VDrumExplorer.Model.Test.csproj --no-build --configuration Release

      - name: Run ViewModel tests
        shell: bash
        run: dotnet test VDrumExplorer.ViewModel.Test/VDrumExplorer.ViewModel.Test.csproj --no-build --configuration Release
