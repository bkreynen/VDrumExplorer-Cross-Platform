# CI workflow: builds the solution, runs all tests with code coverage on Linux/macOS/Windows, and publishes coverage to Coveralls from Linux.
name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Build solution
        shell: bash
        run: dotnet build Drums.sln --configuration Release

      # `dotnet test` accepts only one project on the .NET 10 SDK (MSB1008), so the
      # VSTest-compatible projects are tested in a loop. The Avalonia visual test
      # project is excluded here (runs in the next step).
      - name: Run tests with coverage
        shell: bash
        run: |
          for project in \
            VDrumExplorer.Model.Test/VDrumExplorer.Model.Test.csproj \
            VDrumExplorer.ViewModel.Test/VDrumExplorer.ViewModel.Test.csproj \
            VDrumExplorer.Utility.Test/VDrumExplorer.Utility.Test.csproj \
            VDrumExplorer.Proto.Test/VDrumExplorer.Proto.Test.csproj \
            VDrumExplorer.Midi.ManagedMidi.Test/VDrumExplorer.Midi.ManagedMidi.Test.csproj
          do
            dotnet test "$project" \
              --no-build --configuration Release \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults \
              --settings coverlet.runsettings
          done

      # The Avalonia headless visual tests run their own executable (xunit.v3 on
      # Microsoft.Testing.Platform) and render with the bundled Inter font, so they are
      # invoked directly rather than via `dotnet test`. On Linux the run is wrapped in
      # the `dotnet-coverage` global tool to collect coverage: coverlet.collector is a
      # VSTest data collector that never loads outside VSTest, and every coverlet.MTP
      # release depends on Microsoft.Testing.Platform >= 2.0.2, which is
      # binary-incompatible with the MTP 1.9.1 that xunit.v3 3.2.2 was compiled against
      # (TypeLoadException at startup). Exclusions live in dotnet-coverage.settings.xml.
      # Other OSes run the tests bare: dynamic instrumentation is unavailable on macOS
      # arm64 runners, and only Linux publishes coverage to Coveralls.
      - name: Run Avalonia visual tests with coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: 1
        run: |
          dotnet tool install --global dotnet-coverage
          mkdir -p ./TestResults
          dotnet-coverage collect \
            --settings dotnet-coverage.settings.xml \
            --output-format cobertura \
            --output ./TestResults/VDrumExplorer.Gui.Avalonia.Test.cobertura.xml \
            --nologo \
            -- dotnet VDrumExplorer.Gui.Avalonia.Test/bin/Release/net10.0/VDrumExplorer.Gui.Avalonia.Test.dll

      - name: Run Avalonia visual tests
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: dotnet VDrumExplorer.Gui.Avalonia.Test/bin/Release/net10.0/VDrumExplorer.Gui.Avalonia.Test.dll

      # Per-project coverlet reports each include ALL instrumented production
      # modules loaded in that test host, so shared assemblies get counted
      # multiple times when the reports are summed naively. `dotnet-coverage
      # merge` unions per-module coverage instead, producing a single correct
      # report used for the threshold check and the Coveralls upload.
      # (dotnet-coverage is already installed by the Avalonia test step above.)
      - name: Merge coverage reports
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: 1
        run: |
          mkdir -p ./TestResults
          files=$(find ./TestResults -name '*.cobertura.xml' | tr '\n' ' ')
          dotnet-coverage merge $files \
            --output-format cobertura \
            --output ./TestResults/merged.cobertura.xml \
            --nologo

      - name: Locate cobertura files
        if: matrix.os == 'ubuntu-latest'
        id: coverage
        shell: bash
        run: |
          echo "files=./TestResults/merged.cobertura.xml" >> "$GITHUB_OUTPUT"

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Read from the single merged Cobertura report (see "Merge coverage
          # reports" above): the merge unions per-module coverage, so the
          # aggregate is correct — summing per-project reports would
          # double-count shared assemblies.
          xml="./TestResults/merged.cobertura.xml"
          if [ ! -f "$xml" ]; then
            echo "ERROR: Merged coverage report not found at $xml"
            exit 1
          fi
          rate=$(grep -oP '<coverage[^>]*line-rate="\K[0-9.]+' "$xml" | head -1)
          lines_valid=$(grep -oP '<coverage[^>]*lines-valid="\K[0-9]+' "$xml" | head -1)
          lines_covered=$(grep -oP '<coverage[^>]*lines-covered="\K[0-9]+' "$xml" | head -1)

          if [ -z "$lines_valid" ] || [ "$lines_valid" = "0" ]; then
            echo "WARNING: No line coverage data found in merged report."
            exit 0
          fi

          overall=$(awk "BEGIN {printf \"%.1f\", ($lines_covered / $lines_valid) * 100}")
          echo "Overall coverage: $overall% ($lines_covered/$lines_valid lines)"
          threshold=90
          if awk "BEGIN {exit !($overall < $threshold)}"; then
            echo "ERROR: Coverage $overall% is below the $threshold% threshold."
            exit 1
          fi
          echo "Coverage $overall% meets the $threshold% threshold."

      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          files: ${{ steps.coverage.outputs.files }}
          format: cobertura
          fail-on-error: false
