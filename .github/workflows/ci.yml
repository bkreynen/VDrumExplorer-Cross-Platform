# CI workflow: builds the solution, runs all tests with code coverage on Linux/macOS/Windows, and publishes coverage to Coveralls from Linux.
name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Build solution
        shell: bash
        run: dotnet build Drums.sln --configuration Release

      - name: Run tests with coverage
        shell: bash
        run: dotnet test Drums.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --settings coverlet.runsettings

      - name: Locate cobertura files
        if: matrix.os == 'ubuntu-latest'
        id: coverage
        shell: bash
        run: |
          files=$(find ./TestResults -name 'coverage.cobertura.xml' | tr '\n' ' ' | sed 's/ $//')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          files: ${{ steps.coverage.outputs.files }}
          format: cobertura
          fail-on-error: false
