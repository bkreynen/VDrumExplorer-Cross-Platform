# Build workflow: builds the solution on Linux, macOS, and Windows.
# On Linux/macOS only the cross-platform projects are built because the
# Windows-only projects (net48/WiX) cannot be built there. On Windows the
# full solution is built.
name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Build cross-platform projects (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          for project in \
            VDrumExplorer.Console/VDrumExplorer.Console.csproj \
            VDrumExplorer.Gui.Avalonia/VDrumExplorer.Gui.Avalonia.csproj \
            VDrumExplorer.Model/VDrumExplorer.Model.csproj \
            VDrumExplorer.ViewModel/VDrumExplorer.ViewModel.csproj \
            VDrumExplorer.Proto/VDrumExplorer.Proto.csproj \
            VDrumExplorer.Utility/VDrumExplorer.Utility.csproj \
            VDrumExplorer.Midi.ManagedMidi/VDrumExplorer.Midi.ManagedMidi.csproj \
            VDrumExplorer.Blazor/VDrumExplorer.Blazor.csproj \
            VDrumExplorer.Benchmarks/VDrumExplorer.Benchmarks.csproj \
            VDrumExplorer.InstrumentParser/VDrumExplorer.InstrumentParser.csproj \
            VDrumExplorer.Model.Test/VDrumExplorer.Model.Test.csproj \
            VDrumExplorer.ViewModel.Test/VDrumExplorer.ViewModel.Test.csproj
          do
            dotnet build "$project" --configuration Release
          done

      - name: Build full solution (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: dotnet build Drums.sln --configuration Release
